# Daily live measurement for the showcase page (docs/index.html).
#
# Runs the UNMODIFIED internetnl CLI against the public netnl facade at
# https://api.westerweel.work — the same command any tenant runs — and
# commits the CLI's own --json results document to docs/data/latest.json,
# which the GitHub Pages site renders. A one-line score summary per run is
# appended to docs/data/history.jsonl for later trend views.
#
# The measured set is fixed and operator-owned (westerweel.work and two of
# its subdomains) — see "The rule" in README.md: only measure hosts you
# operate or have explicit permission to test.
#
# Secrets: INTERNETNL_USERNAME / INTERNETNL_PASSWORD — a dedicated
# `demo-showcase` tenant credential on the facade (issued with
# `netnl-admin user add`, rate-limited like any tenant).
name: measure

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install the CLI (from main, unmodified)
        run: uv tool install git+https://github.com/MWest2020/internetnl-cli

      - name: Measure (submit + poll to completion)
        env:
          INTERNETNL_ENDPOINT: https://api.westerweel.work
          INTERNETNL_USERNAME: ${{ secrets.INTERNETNL_USERNAME }}
          INTERNETNL_PASSWORD: ${{ secrets.INTERNETNL_PASSWORD }}
        run: |
          mkdir -p docs/data
          internetnl submit \
            westerweel.work api.westerweel.work netnl.westerweel.work \
            --type web --name "demo-showcase $(date -u +%F)" --json \
            > docs/data/latest.json

      - name: Append score summary to history
        run: |
          python3 - <<'EOF'
          import json, pathlib
          doc = json.load(open("docs/data/latest.json"))
          line = {
              "timestamp": doc.get("timestamp"),
              "request_id": doc.get("request_id"),
              "scores": {
                  host: (dom.get("scoring") or {}).get("percentage")
                  for host, dom in (doc.get("domains") or {}).items()
              },
          }
          with open("docs/data/history.jsonl", "a") as f:
              f.write(json.dumps(line, sort_keys=True) + "\n")
          EOF

      - name: Commit results
        run: |
          git config user.name "measure-bot"
          git config user.email "actions@github.com"
          git add docs/data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: daily measurement $(date -u +%F)"
          git push
